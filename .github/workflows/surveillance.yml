name: Surveillance billets GS-Barça

on:
  schedule:
    # Filet de sécurité : GitHub ne lance en pratique ces runs planifiés
    # que toutes les 2 à 6 heures. La continuité vient du relais ci-dessous.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        type: choice
        options: [test, simulation, surveillance, once]
        default: test

concurrency:
  group: surveillance-billets
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restaurer l'historique des alertes
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: etat-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: etat-

      - name: Vérifier les sources
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ -n "$MODE" ] && [ "$MODE" != "surveillance" ]; then
            python bot_billets.py --"$MODE"
          else
            # Surveillance en boucle pendant 5h30 (toutes les ~90 s)
            python bot_billets.py --duree 330
          fi

      - name: Sauvegarder l'historique des alertes
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: etat-${{ github.run_id }}-${{ github.run_attempt }}

      # Relais : à la fin d'un run de surveillance, on relance aussitôt le suivant
      # (jusqu'au 13/10 à 23h59 heure d'Istanbul = 20h59 UTC).
      - name: Relancer la surveillance
        if: success() && (github.event_name == 'schedule' || github.event.inputs.mode == 'surveillance')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y%m%d%H%M)" -lt 202610132059 ]; then
            gh workflow run surveillance.yml --ref main -f mode=surveillance
          else
            echo "Match passé : pas de relance."
          fi
